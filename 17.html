<!DOCTYPE html>
<html>
    <head>
<title> Typography</title>
    
</head>

<body> 
    <h1> Typography</h1>

    <p class="text1"> My coding Class</p>
    <p class="p1"> I love my school Codingal </p>


</body>

<style>
    .text1 {
        color: red;
        font-size: 50px;
    }

    .p1{
        color: yellow;
        font-family:'Times New Roman', Times, serif

    }
    




    <style>
        h1 {
            text-decoration: overline;
            text-transform: capitalize;
        }
        h2 {
            text-decoration: line-through;
            text-transform: uppercase

        }
        h3 {
            text-decoration: underline;
            text-transform: lowercase;
        }
        
    </style>
</head>
<body> 
    <h1> I love Codingal </h1>
    <h2> I love Codingal </h2>
    <h3> I love Codingal </h3>
</body>
</style>
</html>
