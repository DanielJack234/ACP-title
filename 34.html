<!DOCTYPE html>
<html>
    <head> 
        <title> Positioning Example</title>
        <style> 
            .sticky{
                position: sticky;
                top: 0;
                left: 20px;
                background-color: red;
                border: 2px solid black;
                padding: 5px;
                font-size: 20px;
            }
            .relative{
                position: relative;
                top: 0;
                right: 20px;
                border: 2px solid green;
                padding: 5px;
            }
            
            .absolute{
            position: absolute;
                top: 355px;
                right: 20px;
                border: 2px solid red;
                padding: 5px;
            }

            .fixed{
                position: fixed;
                bottom: 0;
                right: 0;
                border: 2px solid blue;
                padding: 5px;
            }

        </style>
    </head>
        <body> 
            <h1> CSS Positioning Example </h1>
            <div>
                with no Positioning property
            </div>
            <div class="sticky">
             Sticky Positioning property
            </div>
            <div class="relative"> 
                Relative Positioning property        
            </div> 
            <div class="absolute">
                absolute Positioning property
            </div>
            <div class="fixed">  
                Fixed positioning property       
            </div>

            <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
        </body>
        </html>
