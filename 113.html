<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
        <title> A simple calculator </title>
        <style>
            body{
                font-family: 'Open Sans', sans-serif;
                background-color: black;
            }
            #container{
                width:1000px;
                height: 550px;
                background-image: black.jpg
                margin: 20px auto;

            }
            #calculator{
                width: 320px;
                height: 520px;
                background-color: rgba(255, 255, 255, 0.1);
                margin: 0 auto;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            #result{
                height: 120px;

            }
            #keyboard{
                height: 400px;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                padding: 20px;
            }
            button{
                font-size: 24px;
                border: none;
                border-radius: 5px;
                background-color: rgba(255, 255, 255, 0.2);
                color: white;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }
            button:hover{
                background-color: rgba(255, 255, 255, 0.4);
            }
            .operator{
                background-color: rgba(255, 255, 255, 0.3);
            }
            .operator:hover{
                background-color: rgba(255, 255, 255, 0.5);
            }
            .zero{
                grid-column: span 2;
            }

        </style>
    </head>
    <body>
        <div id="container">
            <div id="calculator">
                <div id="result">
                    <div id="history">
                        <p id="history-value"></p>
                    </div>
                </div>
                <div id="keyboard">
                    <button class="operator" id="clear">C</button>
                    <button class="operator" id="backspace">⌫</button>
                    <button class="operator" id="divide">÷</button>
                    <button class="operator" id="multiply">×</button>
                    <button class="number" id="7">7</button>
                    <button class="number" id="8">8</button>
                    <button class="number" id="9">9</button>
                    <button class="operator" id="subtract">-</button>
                    <button class="number" id="4">4</button>
                    <button class="number" id="5">5</button>
                    <button class="number" id="6">6</button>
                    <button class="operator" id="add">+</button>
                    <button class="number" id="1">1</button>
                    <button class="number" id="2">2</button>
                    <button class="number" id="3">3</button>
                    <button class="operator" id="equals">=</button>
                    <button class="number zero" id="0">0</button>
                    <button class="number" id="decimal">.</button>
                </div>
            </div>
        </div>
</html>
