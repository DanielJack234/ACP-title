<!DOCTYPE html>
<html>

<head>

    <title> Form </title>

</head>

<body>
    <h1> School Details </h1>
    <form>
        <fieldset>
            <legend style="text-align: center;"><b>
                    <Details> Form </Details>
                </b></legend>
            <label><mark> Name </mark></label><br>
            <input type="text" id="name"><br><br>
            <label> Email ID </label><br>
            <input type="text" id="email"><br><br>
            <label> Phone Number</label><br>
            <input type="password" id="Contact"><br><br>
            <label> <b>Gender</b> </label><br>
            <input type="radio" id="female" name="gender" value="female">Female<br>
            <input type="radio" id="male" name="gender" value="Male">Male<br>
            <input type="radio" id="others" name="gender" value="Others">Others<br>
            <input type="radio" id="na" name="gender" value="na">Prefer not to say<br><br>
            <label> <b>Prefered Course</b> </label><br>
            <input type="checkbox" id="course" name="Course" value="Computer Science">Computer Science <br>
            <input type="checkbox" id="course" name="course" value="Engish Department">English Department <br>
            <input type="checkbox" id="course" name="course" value="Fine and Applied Art Department">Fine and Appiled Art Department <br>
            <input type="checkbox" id="course" name="course" value="Music Department">Music Department <br><br>

            
            <label><b>Offered Subject</b></label><br>
            <selcet name="Subject" id="Subject">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
                <option value="Music">Music</option>
            </selcet>
            <input type="number" id="m1" name="m1"><br><br>

        </fieldset>
    </form>
</body>

</html>
