<!DOCTYPE html>
<html lang="en">
<head>
  <title> CSS box model Examples </title>
  <style type="text/css"> 
     .example1 {
        width:220px;
        background-color: aqua;
        padding:0px;
        border:0px;
        margin:0px;}

        .example2 {
            width: 220px;
            background-color: blue;
            padding: 50px;
            border: 5px solid black;
            margin: 40px 20px;
        }
            hr{
                background-color: brown;

            }
 </style>
</head>
<body>
    <h1> Box model Example</h1>
    <hr> 
    <p class="example1">My content example 1</p>
    <hr style="width: 10%; height: 10px; color:blue;">
    <p class="example2">My content Example 2</p>
    <hr style="width:20%; height: 1px; color:blueviolet;">
</body>
</html>
