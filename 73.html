<!DOCTYPE html>
    <html lang = "en">
    <head>
        <meta charset="UTF-8"> 
      <title> Real Time Using JS </title>
         <meta name="viewport" content="width=device-width, initial-scale= 1">

         <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                margin: 0;
            }
                h1 {
                    margin: 30px 0 10px;
                    font-size: 34px;
                    font-weight: bold;
                }

                hr{
                    width: 85%;
                    border: none;
                    border-top: 2px solid #ddd;
                    margin-bottom: 25px;

                }

                .box{
                    width: 420px;
                    margin: auto;
                    border: 2px solid #bbb;
                    padding: 18px;
                
                }

                .row{
                    display: flex;
                    align-item: center;
                    justify-content: center;
                    gap: 10px;
                    margin: 10px 0;

                }

                label{
                    width: 90px;
                    text-align: right;
                    font-size: 10px;

                }

                input{
                    height: 24px;
                    padding: 4px;
                    border: 1px solid #999;

                }

                #email, #password{ width: 170px; }
                #age{ width: 55px; }

                button{
                    margin-top: 10px;
                    padding: 4px 14px;
                    cursor: pointer;

                }

                #message{
                    margin-top: 20px;
                    font-size: 22px;
                    font-weight: 500;
                }
         </style>
         </head>
    <body>
        <h1> Real Time Using JS </h1>
        <hr>

        <div class="box">
            <div class="row">
                <label for="email"> Email: </label>
                <input type="text" id="email" placeholder="Enter your email">
            </div>

            <div class="row">
                <label for="password"> Password: </label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="row">
                <label for="age"> Age: </label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <button type="button" onclick="validate()"> Submit </button>

            <p id="message"></p>
        </div>

        <script>
            function validate() {
                var email = document.getElementById("email").value;
                var password = document.getElementById("password").value;
                var age = document.getElementById("age").value;

                if (email === "" || password === "" || age === "") {
                    document.getElementById("message").innerHTML = "Please fill in all fields.";
                    document.getElementById("message").style.color = "red";
                } else if (age < 18) {
                    document.getElementById("message").innerHTML = "You must be at least 18 years old.";
                    document.getElementById("message").style.color = "red";
                } else {
                    document.getElementById("message").innerHTML = "Form submitted successfully!";
                    document.getElementById("message").style.color = "green";
                }
            }
        </script>
