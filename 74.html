<!DOCTYPE html>
<html>
<head>
    <title>Accessing Values with HTML DOM Structure</title>
</head>

<body>

<h2>Accessing values with HTML DOM Structure</h2>

<p id="para1">Paragraph 1 will appear here</p>
<p id="para2">Paragraph 2 will appear here</p>

<button onclick="fetchTitle()">Click Me</button>

<script>
function fetchTitle() {
    // Fetch page title
    var pageTitle = document.title;

    // Display in two paragraphs
    document.getElementById("para1").innerHTML = pageTitle;
    document.getElementById("para2").innerHTML = pageTitle;
}
</script>

</body>
</html>
